[package]
name = "hentai_flutter"
description = "Flutter Rust Bridge glue for Hentai Library"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

# Cannot use lints.workspace = true while overriding rust.unexpected_cfgs for FRB.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
# Keep in sync with [workspace.lints.clippy] in core/Cargo.toml (cannot use lints.workspace).
# Groups first (lower priority) so named lints below can override.
pedantic = { level = "warn", priority = -1 }
# Restriction / high-signal extras (not whole nursery / restriction groups).
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
redundant_clone = "warn"

[dependencies]
flutter_rust_bridge = "=2.13.0"
hentai-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[dev-dependencies]
tempfile = "3"
