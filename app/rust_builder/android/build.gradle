// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.hentai_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.hentai_flutter'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 33

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "hentai_flutter"
}

// unrar-ng links libc++_shared; ship the NDK .so next to libhentai_flutter.so
// so dlopen can resolve C++ typeinfo / exception symbols at runtime.
// PDF uses vendored libpdfium.so (same jniLibs folder, bound by soname at runtime).
def androidAbiToNdkTriple = [
    'armeabi-v7a': 'arm-linux-androideabi',
    'arm64-v8a'  : 'aarch64-linux-android',
    'x86'        : 'i686-linux-android',
    'x86_64'     : 'x86_64-linux-android',
]

def androidAbiToPdfiumVendor = [
    'armeabi-v7a': 'android-arm',
    'arm64-v8a'  : 'android-arm64',
    'x86'        : 'android-x86',
    'x86_64'     : 'android-x64',
]

afterEvaluate {
    def hostPrebuilt = org.apache.tools.ant.taskdefs.condition.Os.isFamily(
            org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS
    ) ? 'windows-x86_64' : (org.apache.tools.ant.taskdefs.condition.Os.isFamily(
            org.apache.tools.ant.taskdefs.condition.Os.FAMILY_MAC
    ) ? 'darwin-x86_64' : 'linux-x86_64')

    def pdfiumVendorRoot = file("${project.projectDir}/../../../core/vendor")

    tasks.matching { it.name.startsWith('cargokitCargoBuild') }.configureEach { cargoTask ->
        cargoTask.doLast {
            def ndkVersion = cargoTask.ndkVersion
            def sdkDir = cargoTask.sdkDirectory
            if (ndkVersion == null || sdkDir == null) {
                throw new GradleException('cargokit task missing ndkVersion/sdkDirectory; cannot package libc++_shared.so')
            }
            def ndkRoot = new File(sdkDir, "ndk/${ndkVersion}")
            def sysrootLib = new File(
                    ndkRoot,
                    "toolchains/llvm/prebuilt/${hostPrebuilt}/sysroot/usr/lib"
            )
            androidAbiToNdkTriple.each { abi, triple ->
                def destDir = new File(cargoTask.outputDir, abi)
                if (!destDir.isDirectory()) {
                    return
                }
                def src = new File(sysrootLib, "${triple}/libc++_shared.so")
                if (!src.isFile()) {
                    // API-level subdirs (e.g. .../27/libc++_shared.so) on newer NDKs
                    def apiDirs = new File(sysrootLib, triple).listFiles()?.findAll { it.isDirectory() } ?: []
                    src = apiDirs
                            .collect { new File(it, 'libc++_shared.so') }
                            .find { it.isFile() }
                }
                if (src == null || !src.isFile()) {
                    throw new GradleException("libc++_shared.so not found for ${abi} under ${sysrootLib}/${triple}")
                }
                copy {
                    from src
                    into destDir
                }

                def vendorKey = androidAbiToPdfiumVendor[abi]
                def pdfiumSrc = new File(pdfiumVendorRoot, "${vendorKey}/libpdfium.so")
                if (!pdfiumSrc.isFile()) {
                    throw new GradleException(
                            "libpdfium.so not found for ${abi} at ${pdfiumSrc}. Run: core/vendor/fetch-native-deps --android"
                    )
                }
                copy {
                    from pdfiumSrc
                    into destDir
                }
            }
        }
    }
}
