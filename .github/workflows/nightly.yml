# Nightly：不挡 PR。Dart 全量测试只执行一次并收集覆盖率；Rust 覆盖率独立执行。
# 触发：每天 UTC 18:00（仅默认分支 main 会跑定时任务）；也可手动 workflow_dispatch。
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"
  FRB_CODEGEN_VERSION: "2.13.0"

jobs:
  nightly-dart-coverage:
    name: nightly · dart test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter FRB toolchain
        uses: ./.github/actions/setup-flutter-frb
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          frb-codegen-version: ${{ env.FRB_CODEGEN_VERSION }}
          run-build-runner: "true"

      # test/frb_wire loads the host cdylib.
      - name: Run hentai_flutter cdylib build
        run: cargo build --manifest-path core/Cargo.toml -p hentai_flutter

      # Includes the slow-track UI tests; do not run them again in a separate job.
      - name: Run all Dart tests with coverage
        working-directory: app
        run: flutter test --coverage

      - name: Summarize Dart line coverage
        working-directory: app
        run: |
          awk -F: '/^LF:/{found+=$2} /^LH:/{hit+=$2} END {
            pct = found ? hit * 100 / found : 0
            printf "Dart line coverage: %.1f%% (%d / %d lines)\n", pct, hit, found
          }' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Dart coverage lcov artifact
        uses: actions/upload-artifact@v5
        with:
          name: dart-coverage-lcov
          path: app/coverage/lcov.info
          retention-days: 30

  nightly-rust-coverage:
    name: nightly · rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Fetch native dependencies
        run: bash "${GITHUB_WORKSPACE}/core/vendor/fetch-native-deps.sh"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run hentai-core coverage
        env:
          RUST_COVERAGE_HTML: "1"
        run: bash .github/scripts/run-rust-coverage.sh

      - name: Zip HTML coverage report
        working-directory: target/rust-coverage
        run: zip -r rust-coverage-html.zip html

      - name: Upload Rust lcov
        uses: actions/upload-artifact@v5
        with:
          name: rust-coverage-lcov
          path: target/rust-coverage/lcov.info
          retention-days: 30

      - name: Upload Rust HTML coverage zip
        uses: actions/upload-artifact@v5
        with:
          name: rust-coverage-html
          path: target/rust-coverage/rust-coverage-html.zip
          retention-days: 30

  nightly-rust-fuzz:
    name: nightly · rust fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Override repo rust-toolchain.toml (pinned stable) for fuzz.
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Fetch native dependencies
        run: bash "${GITHUB_WORKSPACE}/core/vendor/fetch-native-deps.sh"

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Run timed fuzz targets
        env:
          RUST_FUZZ_MAX_TOTAL_TIME: "120"
        run: bash .github/scripts/run-rust-fuzz.sh

  nightly-rust-miri:
    name: nightly · rust miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust nightly with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Override repo rust-toolchain.toml (pinned stable) for miri.
          toolchain: nightly
          components: miri, rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Run filtered miri lib tests
        run: bash .github/scripts/run-rust-miri.sh
