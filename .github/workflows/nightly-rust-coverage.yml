# hentai-core 行覆盖率（lcov + HTML zip，非门禁）。与 Dart nightly-coverage 分离，便于单独调试。
# 触发：仅 workflow_dispatch（稳定后可再加 schedule）。
name: Nightly Rust coverage

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-rust-coverage:
    name: nightly · rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Fetch native dependencies
        run: bash "${GITHUB_WORKSPACE}/core/vendor/fetch-native-deps.sh"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run hentai-core coverage
        env:
          RUST_COVERAGE_HTML: "1"
        run: bash scripts/run-rust-coverage.sh

      - name: Zip HTML coverage report
        working-directory: target/rust-coverage
        run: zip -r rust-coverage-html.zip html

      - name: Upload Rust lcov
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: target/rust-coverage/lcov.info
          retention-days: 30

      - name: Upload Rust HTML coverage zip
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-html
          path: target/rust-coverage/rust-coverage-html.zip
          retention-days: 30
